name: ci
on:
  push:
    branches: [release]

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      # Dummy values: the build only needs env to be well-formed. No database is contacted.
      DATABASE_URL: postgresql://ci:ci@localhost/ci
      BETTER_AUTH_SECRET: ci-only-secret-ci-only-secret-ci-only-secret
      BETTER_AUTH_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  migrate:
    # Applies drizzle migrations to Neon after verification passes on release. Needs the DATABASE_URL_UNPOOLED repo secret.
    if: github.ref == 'refs/heads/release' && github.event_name == 'push'
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run db:migrate
        env:
          DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
