name: ci-cd
on:
  push:
    branches: [release]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    env:
      # Dummy values: the build only needs env to be well-formed. No database is contacted.
      DATABASE_URL: postgresql://ci:ci@localhost/ci
      BETTER_AUTH_SECRET: ci-only-secret-ci-only-secret-ci-only-secret
      BETTER_AUTH_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Require a merged main-to-release pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" \
            --jq '.[] | select(.merged_at != null and .base.ref == "release" and .head.ref == "main" and .head.repo.full_name == .base.repo.full_name) | .merge_commit_sha' \
            | grep -Fxq "$GITHUB_SHA"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: node deploy/check.mjs --self-test

  migrate:
    # Applies drizzle migrations to Neon after verification passes on release. Needs the DATABASE_URL_UNPOOLED repo secret.
    if: github.ref == 'refs/heads/release' && github.event_name == 'push'
    needs: verify
    environment: production
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run db:migrate
        env:
          DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}

  deploy:
    # SSH travels over SSM. GitHub OIDC credentials can reach only this instance; CI cannot edit the firewall.
    if: github.ref == 'refs/heads/release' && github.event_name == 'push'
    needs: [verify, migrate]
    runs-on: ubuntu-24.04
    concurrency: deploy-prod
    environment: production
    permissions:
      contents: read
      id-token: write
    env:
      HOST: ubuntu@i-056b2dbe47b5a1a63
      SDS_SSH_KEY: /home/runner/.ssh/sds-prod.pem
      AWS_DEFAULT_REGION: ap-southeast-1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::573693339820:role/sds-github-deploy
          role-session-name: sds-deploy-${{ github.run_id }}
          aws-region: ap-southeast-1
      - name: Install Session Manager plugin
        run: |
          curl -fsS https://s3.amazonaws.com/session-manager-downloads/plugin/latest/ubuntu_64bit/session-manager-plugin.deb -o /tmp/session-manager-plugin.deb
          sudo dpkg -i /tmp/session-manager-plugin.deb
      - name: Set up SSH
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_HOST_KEY: ${{ vars.EC2_HOST_KEY }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" > "$SDS_SSH_KEY"
          chmod 600 "$SDS_SSH_KEY"
          printf '%s %s\n' "${HOST#*@}" "$EC2_HOST_KEY" >> ~/.ssh/known_hosts
          cat > ~/.ssh/config <<'EOF'
          Host i-056b2dbe47b5a1a63
            StrictHostKeyChecking yes
            ProxyCommand aws ssm start-session --target %h --document-name sds-ssh --region ap-southeast-1
          EOF
      - run: deploy/deploy.sh "$HOST"
      - name: Health check
        run: |
          for i in 1 2 3 4 5 6; do
            ssh -i "$SDS_SSH_KEY" "$HOST" 'cd /opt/sds && docker compose exec -T app node --input-type=module - health < deploy/check.mjs' && exit 0
            sleep 10
          done
          exit 1
